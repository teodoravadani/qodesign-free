  <script>
/* Show HN attribution: a visit that came from Hacker News keeps utm_source=hn on qodesign.dev links. */
(function(){
  try {
    var hn = /^https?:\/\/([a-z0-9-]+\.)*news\.ycombinator\.com(\/|$)/i.test(document.referrer || '');
    try { if (hn) sessionStorage.setItem('qd_from_hn', '1'); else hn = sessionStorage.getItem('qd_from_hn') === '1'; } catch (e) {}
    if (!hn) return;
    var tag = function (a) {
      try {
        var u = new URL(a.href, location.href);
        if (!/(^|\.)qodesign\.dev$/i.test(u.hostname)) return;
        if (u.searchParams.get('utm_source') === 'hn' && u.searchParams.get('utm_medium') === 'showhn') return;
        u.searchParams.set('utm_source', 'hn');
        u.searchParams.set('utm_medium', 'showhn');
        a.href = u.toString();
      } catch (e) {}
    };
    var all = function () { var l = document.querySelectorAll('a[href*="qodesign.dev"]'); for (var i = 0; i < l.length; i++) tag(l[i]); };
    var onEvt = function (e) { var a = e.target && e.target.closest && e.target.closest('a[href]'); if (a) tag(a); };
    ['pointerdown', 'click', 'auxclick', 'contextmenu', 'keydown', 'focusin'].forEach(function (t) { document.addEventListener(t, onEvt, true); });
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', all); else all();
    window.addEventListener('load', all);
    if (window.MutationObserver) { var t = 0; new MutationObserver(function () { clearTimeout(t); t = setTimeout(all, 50); }).observe(document.documentElement, { childList: true, subtree: true }); }
  } catch (e) {}
})();
</script>

<!-- qd-twin: paid twin card (Q-651) -->
<style>.qd-twin{position:fixed;right:16px;bottom:16px;z-index:2147483000;box-sizing:border-box;width:300px;max-width:calc(100vw - 24px);margin:0;padding:0;font:14px/1.4 'Space Grotesk',system-ui,-apple-system,sans-serif;color:#F4F4F6;-webkit-font-smoothing:antialiased;opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s cubic-bezier(.16,1,.3,1)}
.qd-twin.qd-on{opacity:1;transform:none}
.qd-twin *{box-sizing:border-box}
.qd-twin a.qd-twin-a{display:grid;gap:3px;padding:12px 40px 12px 14px;border-radius:14px;background:rgba(17,18,24,.94);border:1px solid #2E3342;box-shadow:0 10px 30px rgba(0,0,0,.35);color:#F4F4F6;text-decoration:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.qd-twin a.qd-twin-a:hover{border-color:#C6FF3D}
.qd-twin a.qd-twin-a:focus-visible{outline:2px solid #C6FF3D;outline-offset:2px}
.qd-twin .qd-k{font:500 10px/1.2 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:#C6FF3D}
.qd-twin .qd-n{font-weight:600;font-size:15px}
.qd-twin .qd-d{color:#A3A8B8;font-size:13px}
.qd-twin .qd-go{font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.qd-twin button.qd-x{position:absolute;top:6px;right:6px;width:30px;height:30px;margin:0;padding:0;border:0;border-radius:8px;background:transparent;color:#8A8FA3;font:18px/30px system-ui,sans-serif;cursor:pointer}
.qd-twin button.qd-x:hover{color:#F4F4F6;background:rgba(255,255,255,.06)}
@media (max-width:560px){.qd-twin{left:12px;right:12px;bottom:12px;width:auto}.qd-twin .qd-d{display:none}.qd-twin a.qd-twin-a{grid-template-columns:1fr auto;align-items:center;column-gap:10px;padding:10px 40px 10px 12px}.qd-twin .qd-k{grid-column:1/-1}.qd-twin .qd-go{white-space:nowrap}.qd-twin .qd-long{display:none}}
@media (prefers-reduced-motion:reduce){.qd-twin{transition:none;transform:none}}
@media print{.qd-twin{display:none}}</style>

<script>(function(){try{var t=document.getElementById('qd-twin');if(!t)return;var k='qd_twin_closed';try{if(sessionStorage.getItem(k)==='1'){t.parentNode.removeChild(t);return;}}catch(e){}
t.hidden=false;var show=function(){requestAnimationFrame(function(){t.classList.add('qd-on');});};if(document.readyState==='complete')setTimeout(show,600);else window.addEventListener('load',function(){setTimeout(show,600);});
t.querySelector('.qd-x').addEventListener('click',function(){try{sessionStorage.setItem(k,'1');}catch(e){}t.parentNode.removeChild(t);});}catch(e){}})();</script>
