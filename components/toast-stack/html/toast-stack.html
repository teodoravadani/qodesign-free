<!doctype html>
<!-- hig-disable-file web/autoplay-media -- the demo is a scripted cursor driving the real component; there is no video or audio element -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toast Stack · qodesign</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Saira+Condensed:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0A0D;--win:#0F1016;--panel:#111218;--panel2:#15161E;--line:#262A36;--line2:#323747;
  --text:#F4F4F6;--muted:#8A8FA3;--faint:#5C6378;--volt:#C6FF3D;--ultra:#8B6CFF;--err:#FF5C7A;--cyan:#5EE1FF;
  --spring:cubic-bezier(.32,1.42,.56,1);--out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden;display:grid;place-items:center}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--volt);outline-offset:3px}
.glow{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(620px 420px at 12% 8%,rgba(139,108,255,.16),transparent 70%),
  radial-gradient(560px 420px at 92% 96%,rgba(198,255,61,.08),transparent 70%)}
.win{position:relative;width:min(1100px,calc(100vw - 48px));height:min(720px,calc(100vh - 56px));background:var(--win);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 50px 140px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.04);display:grid;grid-template-rows:54px 1fr;overflow:hidden}
.bar{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:7px}.dots i{width:11px;height:11px;border-radius:50%;background:#2A2E3B}
.crumb{font:500 13px 'JetBrains Mono',monospace;color:var(--muted)}.crumb b{color:var(--text);font-weight:500}
.bar .sp{flex:1}
.credit{font:500 12px 'JetBrains Mono',monospace;color:var(--muted);text-decoration:none;padding:12px 4px;min-height:44px;display:inline-flex;align-items:center}
.credit:hover{color:var(--volt)}
.ava{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#8B6CFF,#5EE1FF);display:grid;place-items:center;font:700 12px 'Space Grotesk';color:#0A0A0D}
.body{display:grid;grid-template-columns:212px 1fr;min-height:0}
.side{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font:800 22px 'Saira Condensed';letter-spacing:.3px}
.brand span{width:26px;height:26px;border-radius:8px;background:var(--volt);display:grid;place-items:center;color:var(--ink);font-size:16px}
.nav{display:flex;align-items:center;gap:11px;padding:0 12px;height:40px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500;position:relative}
.nav svg{width:17px;height:17px}
.nav.on{color:var(--text);background:#181A23}
.nav.on::before{content:"";position:absolute;left:-12px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--volt)}
.side .foot{margin-top:auto;padding:12px;border-radius:12px;background:#14151C;border:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.45}
.side .foot b{color:var(--text);display:block;font-size:13px;margin-bottom:2px}
.main{padding:26px 30px;overflow:hidden;position:relative;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font:800 46px/0.95 'Saira Condensed';letter-spacing:.2px}
h1 em{font-style:normal;color:var(--volt)}
.sub{margin:8px 0 0;color:var(--muted);font-size:14px}
.sub .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--volt);margin-right:7px;box-shadow:0 0 0 4px rgba(198,255,61,.14);vertical-align:1px}
.acts{display:flex;gap:10px;margin:22px 0 22px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:#161720;font-size:14px;font-weight:600;transition:transform .15s,background .2s,border-color .2s}
.btn svg{width:17px;height:17px;flex:none}
.btn:hover{background:#1C1E29;border-color:#3E4457}
.btn:active,.btn.press{transform:scale(.95)}
.btn.pri{background:var(--volt);color:var(--ink);border-color:var(--volt)}
.btn.pri:hover{background:#D4FF6A}
.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 0;min-width:0}
.card h2{margin:0;padding:14px 18px 10px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.9px;display:flex;justify-content:space-between}
.card h2 span{font:500 12px 'JetBrains Mono';text-transform:none;letter-spacing:0;color:var(--faint)}
.row{display:grid;align-items:center;gap:12px;padding:0 18px;height:54px;border-top:1px solid #1C1E28;font-size:14px;overflow:hidden;transition:height .45s var(--out),opacity .3s,background .6s}
.row.gone{height:0;opacity:0;border-top-color:transparent}
.row.flash{background:rgba(198,255,61,.10)}
.dep{grid-template-columns:88px 1fr auto 64px}
.inv{grid-template-columns:1fr auto auto}
.mono{font:500 13px 'JetBrains Mono',monospace;color:var(--muted)}
.msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(198,255,61,.1);color:var(--volt)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.build{background:rgba(94,225,255,.1);color:var(--cyan)}
.pill.build i{animation:blink 1s infinite}
.pill.paid{background:rgba(139,108,255,.14);color:#B7A6FF}
.amt{font:600 14px 'JetBrains Mono',monospace}
@keyframes blink{50%{opacity:.25}}

/* ---------- toaster ---------- */
.toaster{position:absolute;right:28px;bottom:28px;width:432px;z-index:20}
.scrim{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0;background:rgba(6,6,10,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:opacity .35s}
.scrim.on{opacity:1}
.toaster ol{list-style:none;margin:0;padding:0;position:relative;transition:height .5s var(--out)}
.tw-head{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;height:44px;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .25s,transform .45s var(--spring)}
.tw-head.on{opacity:1;pointer-events:auto;transform:none}
.tw-head p{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.tw-head p b{display:inline-grid;place-items:center;min-width:22px;height:22px;margin-left:6px;padding:0 6px;border-radius:99px;background:#20222D;color:var(--text);font:700 12px 'JetBrains Mono'}
.clear{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:#14151C;font-size:13px;font-weight:600;color:var(--text)}
.clear:hover,.clear.press{background:#1E2030}
.toast{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:48px 1fr auto;align-items:center;column-gap:14px;padding:16px 12px 16px 16px;border-radius:20px;
  background:#17181F;border:1px solid #2B2F3D;box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);transform-origin:50% 0;overflow:hidden;touch-action:pan-y;user-select:none;
  transition:transform .55s var(--spring),opacity .35s,height .45s var(--out),background .4s,border-color .4s,box-shadow .6s}
.toast[data-type=loading]{border-color:transparent;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 34px rgba(94,225,255,.18)}
.toast.won{box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 70px rgba(198,255,61,.45);border-color:rgba(198,255,61,.5)}
.t-ring{position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);overflow:hidden;opacity:0;transition:opacity .6s}
.t-ring i{position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;translate:-50% -50%;background:conic-gradient(from 0deg,transparent 0 58%,rgba(94,225,255,.2) 66%,var(--cyan) 84%,#fff 90%,transparent 93%);animation:rot 1.3s linear infinite}
.toast[data-type=loading] .t-ring{opacity:1}
.t-ring.done{opacity:1}.t-ring.done i{background:var(--volt);animation:none}
.t-ring.fade{opacity:0;transition:opacity .9s .25s}
.toast.drag{transition:none;cursor:grabbing}
.toast .in{display:contents}
.toast>*:not(.t-glow):not(.t-bar):not(.t-ring){transition:opacity .25s}
.toast.back>*:not(.t-glow):not(.t-bar):not(.t-ring){opacity:0}
.toast.back{background:#1F212B;border-color:#353A4A}
.t-glow{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(140px 90px at 34px 50%,rgba(198,255,61,.42),transparent 70%),linear-gradient(100deg,transparent 30%,rgba(198,255,61,.16) 50%,transparent 70%);background-size:100% 100%,260% 100%;background-position:0 0,120% 0}
.toast.bloom .t-glow{animation:bloom 1.1s var(--out) forwards}
@keyframes bloom{0%{opacity:0;background-position:0 0,120% 0}18%{opacity:1}100%{opacity:0;background-position:0 0,-60% 0}}
.t-ico{position:relative;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.t-ico svg{width:26px;height:26px}
.toast[data-type=success]{--c:var(--volt)}.toast[data-type=error]{--c:var(--err)}.toast[data-type=info]{--c:var(--ultra)}.toast[data-type=loading]{--c:var(--cyan)}
.toast[data-type=error]{border-color:rgba(255,92,122,.32)}
.t-txt{min-width:0}
.t-title{margin:0;font-size:16px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-desc{margin:4px 0 0;font-size:13.5px;color:var(--muted);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-desc .mono{font-size:12px}
.t-side{display:flex;align-items:center;gap:2px}
.t-act{min-height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--line2);background:#20222D;font-size:13px;font-weight:700;color:var(--text);transition:transform .15s,background .2s}
.t-act:hover,.t-act.press{background:#2A2D3B}.t-act:active,.t-act.press{transform:scale(.94)}
.toast[data-type=error] .t-act{color:var(--err)}
.t-x{width:44px;height:44px;border:0;background:none;border-radius:11px;color:var(--faint);display:grid;place-items:center}
.t-x:hover{color:var(--text);background:#20222D}
.t-x svg{width:16px;height:16px}
.t-bar{position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:2px;background:var(--c);opacity:.55;transform-origin:0 50%;transform:scaleX(0)}
.toast:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
/* spinner → check */
.spin .trk{stroke:rgba(94,225,255,.18)}
.spin .arc{stroke:var(--cyan);stroke-dasharray:15 60;transform-origin:50% 50%;animation:rot .8s linear infinite;transition:stroke-dasharray .3s var(--out),stroke .3s}
.ok .arc{stroke-dasharray:60 0;stroke:var(--volt)}
.fill{transform-origin:50% 50%;transform:scale(0);fill:var(--volt);transition:transform .45s var(--spring)}
.ok .fill{transform:scale(1);transition-delay:.18s}
.chk{stroke:#0A0A0D;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .35s var(--out)}
.ok .chk{stroke-dashoffset:0;transition-delay:.4s}
@keyframes rot{to{transform:rotate(360deg)}}
.spark{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--volt);pointer-events:none}
/* demo cursor */
.cur{position:fixed;left:0;top:0;width:26px;height:26px;z-index:99;pointer-events:none;opacity:0;transition:opacity .3s;will-change:transform}
.cur.on{opacity:1}
.cur svg{width:26px;height:26px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));transition:transform .12s}
.cur.down svg{transform:scale(.82)}
.ring{position:fixed;width:44px;height:44px;margin:-22px;border-radius:50%;border:2px solid var(--volt);pointer-events:none;z-index:98;animation:ring .5s var(--out) forwards}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:820px){
  .body{grid-template-columns:1fr}.side{display:none}
  .grid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .win{width:100%;height:100vh;height:100dvh;border-radius:0;border:0}
  .crumb{display:none}
  .main{padding:20px 16px}
  h1{font-size:40px}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}
  .btn{justify-content:center;padding:0 10px;font-size:13px}
  .dep{grid-template-columns:76px 1fr auto}.dep .mono.t{display:none}
  .toaster{left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));width:auto}
  .t-title{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .toast{column-gap:12px;padding:14px 6px 14px 14px}
}
@media (prefers-reduced-motion:reduce){
  .toast{transition:opacity .2s,height .2s}
  .tw-head{transition:opacity .2s}
  .spin .arc{animation:pulse 1.2s ease-in-out infinite;stroke-dasharray:60 0}
  .fill,.chk,.spin .arc{transition-duration:.15s;transition-delay:0s}
  .toast.bloom .t-glow{animation:none}
  .btn:active,.btn.press,.t-act.press,.t-act:active{transform:none}
  .row{transition:opacity .2s}
  .cur{transition:none}
}
@keyframes pulse{50%{opacity:.35}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="win" id="win">
  <header class="bar">
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="crumb">northline / <b>web</b> / deploys</div>

    <div class="ava" aria-hidden="true">MK</div>

  <div class="body">

      <a class="nav on" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg>Deploys</a>
      <a class="nav"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>Invoices</a>
      <a class="nav"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/></svg>API keys</a>
      <a class="nav"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Team</a>

    <main class="main">
      <div class="head">
        <div>
          <h1>Deploys <em>/ web</em></h1>

      </div>
      <div class="acts">
        <button class="btn pri" id="bDeploy"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Deploy web</button>
        <button class="btn" id="bArchive"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="5" rx="1.5"/><path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9M10 13h4"/></svg>Archive invoice</button>
        <button class="btn" id="bKey"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Rotate API key</button>
        <button class="btn" id="bInvite"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>Invite teammate</button>
      </div>
      <div class="grid">
        <section class="card" aria-label="Recent deploys">
          <h2>Recent deploys <span>main</span></h2>
          <div id="deps"></div>

          <h2>Invoices <span>October</span></h2>

    </main>
  </div>
  <div class="scrim" id="scrim" aria-hidden="true"></div>
  <section class="toaster" id="toaster" aria-label="Notifications (Alt+T)" tabindex="-1">
    <ol id="list" aria-live="polite" aria-relevant="additions text"></ol>
    <div class="tw-head" id="twHead"><p>Notifications<b id="count">0</b></p><button class="clear" id="clearAll">Clear all</button></div>
  </section>
</div>
<div class="cur" id="cur" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 2.5 19.5 12l-6.6 1.6 3.6 7-2.9 1.4-3.5-7.1L5 19.6Z" fill="#F4F4F6" stroke="#0A0A0D" stroke-width="1.4" stroke-linejoin="round"/></svg></div>

<script>
const $ = id => document.getElementById(id);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const P = new URLSearchParams(location.search);
const AUTOPLAY = P.get('autoplay') !== '0';
const IDLE_MS = 4000, GAP = 10, PEEK = 16, VISIBLE = 3, LIFE = 5000;

const ICONS = {
  success:'<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="m7.8 12.3 2.8 2.8 5.6-5.8"/></svg>',
  error:'<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 2.6 19.5h18.8Z"/><path d="M12 9.5v4.3M12 16.8v.1"/></svg>',
  info:'<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5.5M12 7.6v.1"/></svg>',
  loading:'<svg aria-hidden="true" class="spin" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><circle class="trk" cx="12" cy="12" r="9.5"/><circle class="arc" cx="12" cy="12" r="9.5" pathLength="60"/><circle class="fill" cx="12" cy="12" r="11" stroke="none"/><path class="chk" d="m7.6 12.4 3 3 5.8-6" pathLength="1" stroke-width="2.8" stroke-linejoin="round"/></svg>'
};
const X_ICON = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';

/* ---------- app data ---------- */
const DEPLOYS0 = [
  {sha:'9c1e07b', msg:'Fix checkout rounding on yearly plans', st:'Ready', t:'2h'},
  {sha:'52ad3f0', msg:'Add region picker to settings', st:'Ready', t:'5h'},

];
const INVOICES0 = [
  {id:'#1042', who:'Brightwater Studio', amt:'$1,240.00'},
  {id:'#1041', who:'Halcyon Labs', amt:'$860.00'},
  {id:'#1040', who:'Pine & Co', amt:'$2,115.50'},
  {id:'#1039', who:'Stride Health', amt:'$499.00'}
];
function rowDep(d){ const r=document.createElement('div'); r.className='row dep';
  r.innerHTML=`<span class="mono">${d.sha}</span><span class="msg">${d.msg}</span><span class="pill${d.st==='Building'?' build':''}"><i></i>${d.st}</span><span class="mono t" style="text-align:right">${d.t}</span>`; return r; }

let archived = null, building = null;

function finishBuild(r){ if(!r||!r.isConnected) return; const p=r.querySelector('.pill'); p.className='pill'; p.innerHTML='<i></i>Ready'; r.classList.add('flash'); setTimeout(()=>r.classList.remove('flash'),700); }
function archiveInvoice(){

  r.classList.add('gone'); archived = r; return r.dataset.id;
}
function restoreInvoice(){ if(!archived) return; const r=archived; archived=null; r.classList.remove('gone'); r.classList.add('flash'); setTimeout(()=>r.classList.remove('flash'),800); }

/* ---------- toaster ---------- */
const list = $('list'), toaster = $('toaster'), head = $('twHead');
let toasts = [], seq = 0, expanded = false, hoverIn = false, focusIn = false, mode = AUTOPLAY ? 'demo' : 'live';

function toast(o){
  const id = ++seq;
  const el = document.createElement('li');
  el.className = 'toast'; el.tabIndex = 0; el.dataset.type = o.type; el.dataset.id = id;
  el.setAttribute('role', o.type === 'error' ? 'alert' : 'status');
  el.innerHTML = `<div class="t-ring"><i></i></div><div class="t-glow"></div><div class="t-ico">${ICONS[o.type]}</div>
    <div class="t-txt"><p class="t-title"></p><p class="t-desc"></p></div>
    <div class="t-side">${o.action?`<button class="t-act">${o.action.label}</button>`:''}<button class="t-x" aria-label="Dismiss notification">${X_ICON}</button></div><div class="t-bar"></div>`;
  el.querySelector('.t-title').textContent = o.title;
  el.querySelector('.t-desc').innerHTML = o.desc || '';
  const t = {id, el, o, h:0, left: LIFE, started: 0, exiting:false, x:0};
  if (o.action) el.querySelector('.t-act').addEventListener('click', e => { e.stopPropagation(); o.action.fn(t); if (!o.action.keep) dismiss(t); });
  el.querySelector('.t-x').addEventListener('click', e => { e.stopPropagation(); dismiss(t); });
  el.addEventListener('keydown', e => { if (e.target === el && ['Escape','Delete','Backspace'].includes(e.key)) { e.preventDefault(); const nx = toasts[toasts.indexOf(t)+1]; dismiss(t); (nx?nx.el:toaster).focus(); } });
  bindSwipe(t);
  el.style.opacity = '0'; el.style.transform = RM ? 'none' : 'translateY(120%) scale(.9)';
  list.appendChild(el);
  t.h = el.offsetHeight;
  toasts.unshift(t);
  requestAnimationFrame(() => requestAnimationFrame(layout));
  if (o.promise) {
    t.loading = true;
    const born = performance.now();   // keep the spinner up for at least 600 ms so fast promises don't flash
    o.promise.then(r => setTimeout(() => { if (!t.exiting && t.el.isConnected) resolveToast(t, r); }, Math.max(0, 600 - (performance.now() - born))));
  }
  armTimer(t);
  return t;
}
function resolveToast(t, r){
  t.loading = false;
  const el = t.el, ico = el.querySelector('.spin');
  ico.parentElement.classList.add('ok');
  setTimeout(() => {
    el.dataset.type = 'success';
    el.querySelector('.t-title').textContent = r.title;
    el.querySelector('.t-desc').innerHTML = r.desc;
    const ring = el.querySelector('.t-ring'); ring.classList.add('done'); requestAnimationFrame(() => ring.classList.add('fade'));
    if (!RM) { el.classList.remove('bloom'); void el.offsetWidth; el.classList.add('bloom', 'won'); setTimeout(() => el.classList.remove('won'), 900); burst(el.querySelector('.t-ico')); pop(el); }
    if (r.after) r.after();
    armTimer(t);
  }, RM ? 120 : 380);
}
function pop(el){ el.animate([{scale:'1'},{scale:'1.045'},{scale:'.985'},{scale:'1'}], {duration:520, easing:'cubic-bezier(.2,.8,.2,1)', composite:'add'}); }
function burst(host){
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('i'); s.className = 'spark';
    const a = i / 16 * Math.PI * 2 + Math.random() * .3, d = 30 + Math.random() * 26;
    if (i % 3 === 1) s.style.background = '#F4F4F6'; if (i % 3 === 2) { s.style.width = s.style.height = '4px'; }
    host.appendChild(s);
    s.animate([{transform:'translate(0,0) scale(1)', opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.2)`, opacity:0}], {duration:620+Math.random()*200, easing:'cubic-bezier(.1,.8,.3,1)'}).onfinish = () => s.remove();
  }
}
function live(){ return toasts.filter(t => !t.exiting); }
function layout(){
  const ts = live();
  const frontH = ts.length ? ts[0].h : 0;
  let acc = 0;
  ts.forEach((t, i) => {
    const el = t.el;
    let y, s, op, h;
    if (expanded) { y = -acc; s = 1; op = 1; h = t.h; acc += t.h + GAP; }
    else { y = -PEEK * i; s = 1 - i * .055; op = i < VISIBLE ? 1 - i * .12 : 0; h = i === 0 ? t.h : frontH; }
    el.classList.toggle('back', !expanded && i > 0);
    el.style.transitionDelay = RM || el.classList.contains('drag') ? '' : `${i * 35}ms`;
    el.style.height = h + 'px';
    el.style.zIndex = String(100 - i);
    el.style.opacity = String(op);
    el.style.pointerEvents = op ? '' : 'none';
    if (!el.classList.contains('drag')) el.style.transform = RM ? 'none' : `translate(${t.x}px,${y}px) scale(${s})`;
    if (RM) { el.style.bottom = (-y) + 'px'; }
    el.toggleAttribute('inert', !expanded && i > 0);
  });
  const total = expanded ? Math.max(0, acc - GAP) : (ts.length ? frontH + PEEK * Math.min(ts.length - 1, VISIBLE - 1) : 0);
  list.style.height = total + 'px';
  head.classList.toggle('on', expanded && ts.length > 1);
  $('scrim').classList.toggle('on', expanded && ts.length > 0);
  head.style.bottom = (total + 8) + 'px';
  $('count').textContent = ts.length;
  ts.forEach(armTimer);
}
function armTimer(t){
  const el = t.el, bar = el.querySelector('.t-bar');
  const paused = mode === 'demo' || expanded || t.loading || t.exiting || t.o.sticky;
  clearTimeout(t.timer);
  if (paused) {
    if (t.started) { t.left -= performance.now() - t.started; t.started = 0; }
    const k = Math.max(0, t.left / LIFE);
    bar.style.transition = 'none'; bar.style.transform = `scaleX(${mode === 'demo' || t.loading ? 0 : k})`;
    return;
  }
  if (t.started) return;
  t.started = performance.now();
  bar.style.transition = 'none'; bar.style.transform = `scaleX(${t.left / LIFE})`;
  void bar.offsetWidth;
  bar.style.transition = `transform ${t.left}ms linear`; bar.style.transform = 'scaleX(0)';
  t.timer = setTimeout(() => dismiss(t), t.left);
}
function dismiss(t, dir = 0){
  if (!t || t.exiting) return;
  t.exiting = true; clearTimeout(t.timer);
  const el = t.el;
  el.style.pointerEvents = 'none'; el.style.transitionDelay = '0ms';
  el.classList.remove('drag');
  if (RM) { el.style.opacity = '0'; }
  else if (dir) { el.style.transition = 'transform .42s cubic-bezier(.3,.7,.4,1),opacity .35s'; el.style.transform = `translate(${dir * 440}px,${el.style.transform.match(/,\s*(-?[\d.]+)px/)?.[1] || 0}px) rotate(${dir * 14}deg)`; el.style.opacity = '0'; }
  else { el.style.transform += ' translateY(18px) scale(.9)'; el.style.opacity = '0'; }
  setTimeout(() => { el.remove(); toasts = toasts.filter(x => x !== t); }, 450);
  if (live().length < 2 && expanded && !hoverIn && !focusIn) expanded = false;
  layout();
}
function clearAll(){
  const ts = live();
  ts.slice().reverse().forEach((t, i) => setTimeout(() => dismiss(t), RM ? 0 : i * 70));
  setTimeout(() => { expanded = false; layout(); }, RM ? 50 : ts.length * 70 + 120);
}
function setExpanded(v){ if (expanded === v) return; expanded = v; layout(); }

/* swipe to dismiss */
function bindSwipe(t){
  const el = t.el; let sx = 0, sy = 0, st = 0, on = false, pid = null;
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('button')) return;
    on = true; pid = e.pointerId; sx = e.clientX; st = performance.now(); el.setPointerCapture(pid);
  });
  el.addEventListener('pointermove', e => { if (!on || e.pointerId !== pid) return; dragTo(t, e.clientX - sx); });
  const end = e => { if (!on || e.pointerId !== pid) return; on = false; release(t, (e.clientX - sx) / Math.max(1, performance.now() - st)); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function dragTo(t, dx){
  const el = t.el; t.x = dx; el.classList.add('drag');
  const i = live().indexOf(t); let y = 0;
  if (expanded) { for (let k = 0; k < i; k++) y -= live()[k].h + GAP; } else y = -PEEK * i;
  const res = Math.abs(dx);
  el.style.transform = RM ? 'none' : `translate(${dx}px,${y}px) rotate(${dx * .025}deg)`;
  el.style.opacity = String(Math.max(.15, 1 - res / 320));
}
function release(t, v){
  const el = t.el; el.classList.remove('drag');
  if (Math.abs(t.x) > 100 || Math.abs(v) > .6) { dismiss(t, Math.sign(t.x || v)); return; }
  t.x = 0; layout();
}

/* hover / focus expand */
toaster.addEventListener('pointerenter', e => { if (mode === 'demo' || e.pointerType === 'touch') return; hoverIn = true; setExpanded(live().length > 0); });
toaster.addEventListener('pointerleave', e => { if (mode === 'demo') return; hoverIn = false; if (!focusIn) setExpanded(false); });
toaster.addEventListener('focusin', () => { if (mode === 'demo') return; focusIn = true; setExpanded(live().length > 0); });
toaster.addEventListener('focusout', e => { if (mode === 'demo') return; if (!toaster.contains(e.relatedTarget)) { focusIn = false; if (!hoverIn) setExpanded(false); } });
toaster.addEventListener('click', e => { if (mode === 'live' && !expanded && e.target.closest('.toast')) setExpanded(true); });
addEventListener('keydown', e => { if (e.altKey && (e.key === 't' || e.key === 'T' || e.code === 'KeyT')) { e.preventDefault(); const f = live()[0]; (f ? f.el : toaster).focus(); } });
$('clearAll').addEventListener('click', clearAll);

/* ---------- the app's actions ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
function doDeploy(ms = 2600){
  const row = startBuild();
  return toast({type:'loading', title:'Deploying web@4f2a1c9', desc:'Building 12 routes · iad1, fra1, sin1',
    promise: wait(ms).then(() => ({title:'Deployed to production', desc:'<span class="mono">4f2a1c9</span> · 38 s · 12 routes', after: () => finishBuild(row)}))});
}
function doArchive(){
  const id = archiveInvoice();
  if (!id) return toast({type:'info', title:'Nothing left to archive', desc:'All October invoices are archived'});
  return toast({type:'success', title:`Invoice ${id} archived`, desc:'Brightwater Studio · $1,240.00', action:{label:'Undo', fn: () => { restoreInvoice(); setTimeout(() => toast({type:'info', title:`Invoice ${id} restored`, desc:'Back in October invoices'}), 160); }}});
}
function doKey(){ return toast({type:'error', title:"Couldn’t rotate the API key", desc:'Your session expired. Sign in and try again.', action:{label:'Retry', fn: () => setTimeout(() => toast({type:'success', title:'API key rotated', desc:'<span class="mono">nl_live_••••7Q2c</span> · old key works for 24 h'}), 160)}}); }
function doInvite(){ return toast({type:'info', title:'Invite sent to mara@northline.dev', desc:'They get Developer access when they join'}); }
$('bDeploy').addEventListener('click', () => doDeploy());
$('bArchive').addEventListener('click', doArchive);
$('bKey').addEventListener('click', doKey);
$('bInvite').addEventListener('click', doInvite);

/* ---------- demo: a scripted cursor drives the real component ---------- */
const cur = $('cur'); let cx = innerWidth * .62, cy = innerHeight * .7, run = 0;
function place(x, y, ms){ cx = x; cy = y; cur.style.transition = RM || !ms ? 'opacity .3s' : `transform ${ms}ms cubic-bezier(.45,.05,.2,1),opacity .3s`; cur.style.transform = `translate(${x - 4}px,${y - 3}px)`; }
const sleep = (ms, id = run) => new Promise((res, rej) => setTimeout(() => id === run ? res() : rej('stop'), ms));
function centre(el, fx = .5, fy = .5){ const r = el.getBoundingClientRect(); return [r.left + r.width * fx, r.top + r.height * fy]; }
async function moveTo(el, ms = 520, fx, fy){ const [x, y] = centre(el, fx, fy); place(x, y, ms); await sleep(RM ? 120 : ms); }
async function click(el){
  cur.classList.add('down'); el.classList.add('press');
  if (!RM) { const r = document.createElement('i'); r.className = 'ring'; r.style.left = cx + 'px'; r.style.top = cy + 'px'; document.body.appendChild(r); setTimeout(() => r.remove(), 520); }
  await sleep(130); cur.classList.remove('down'); el.classList.remove('press');
}
function tByTitle(s){ return live().find(t => t.el.querySelector('.t-title').textContent.includes(s)); }
async function demo(){
  const id = ++run;
  try {
    place(innerWidth * .55, innerHeight * .78, 0); cur.classList.add('on');
    await sleep(350, id);
    await moveTo($('bDeploy'), 600); await click($('bDeploy')); doDeploy(RM ? 2400 : 3300);
    await sleep(380, id);
    await moveTo($('bArchive'), 420); await click($('bArchive')); doArchive();
    await sleep(380, id);
    await moveTo($('bKey'), 420); await click($('bKey')); doKey();
    await sleep(520, id);
    await moveTo(live()[0].el, 600, .38, .5); setExpanded(true);
    await sleep(1650, id);                       // the promise toast resolves while fanned out
    const err = tByTitle('rotate');
    if (err) {
      await moveTo(err.el, 420, .35, .5); cur.classList.add('down'); await sleep(120, id);
      const [x0, y0] = [cx, cy], D = 230, N = RM ? 3 : 24;
      for (let k = 1; k <= N; k++) { const e = 1 - Math.pow(1 - k / N, 2); place(x0 + D * e, y0, 0); dragTo(err, D * e); await sleep(16, id); }
      cur.classList.remove('down'); release(err, 1.2);
      await sleep(620, id);
    }
    const arc = tByTitle('archived');
    if (arc) { const b = arc.el.querySelector('.t-act'); await moveTo(b, 520); await click(b); b.click(); }
    await sleep(950, id);
    if (live().length > 1) { await moveTo($('clearAll'), 520); await click($('clearAll')); clearAll(); }
    await sleep(300, id);
    place(cx + 140, cy + 120, 700); setExpanded(false);
    await sleep(450, id);
    resetAll(false); await sleep(300, id);
    if (id === run) demo();
  } catch (e) { /* stopped by real input */ }
}
function resetAll(bump = true){
  if (bump) run++;
  toasts.forEach(t => { clearTimeout(t.timer); t.el.remove(); });
  toasts = []; expanded = false; hoverIn = false; focusIn = false;
  resetApp(); layout();
}

/* real input takes over; 4 s after the last input the demo comes back */
function takeOver(e){
  if (!e.isTrusted || mode !== 'demo') return;
  mode = 'live'; run++; cur.classList.remove('on','down');
  document.querySelectorAll('.press').forEach(n => n.classList.remove('press'));
  live().forEach(t => { if (t.el.classList.contains('drag')) { t.x = 0; t.el.classList.remove('drag'); } });
  hoverIn = toaster.matches(':hover'); expanded = hoverIn && live().length > 0; layout();
}
['pointerdown','keydown'].forEach(ev => addEventListener(ev, takeOver, {capture:true}));
let lastInput = performance.now(), pressed = 0, mvX = null, mvY = null;
['pointerdown','pointermove','keydown','wheel','touchstart'].forEach(ev => addEventListener(ev, e => {
  if (!e.isTrusted) return;
  if (e.type === 'pointermove') { if (mvX !== null && Math.abs(e.clientX - mvX) + Math.abs(e.clientY - mvY) < 4) return; mvX = e.clientX; mvY = e.clientY; }
  lastInput = performance.now();
}, {capture:true, passive:true}));
addEventListener('pointerdown', e => { if (e.isTrusted) pressed++; }, {capture:true, passive:true});
['pointerup','pointercancel'].forEach(ev => addEventListener(ev, e => { if (e.isTrusted) pressed = Math.max(0, pressed - 1); }, {capture:true, passive:true}));
function backToDemo(){
  mode = 'demo'; if (document.activeElement && toaster.contains(document.activeElement)) document.activeElement.blur();
  resetAll(); setTimeout(demo, 300);
}
if (AUTOPLAY) setInterval(() => {
  if (mode === 'live' && !pressed && !live().some(t => t.loading) && performance.now() - lastInput > IDLE_MS) backToDemo();
}, 250);

resetApp(); layout();
if (AUTOPLAY) demo();
